resources:
  jobs:
    semantic_layer_job:
      name: "${var.app_name}${var.app_name_suffix}_semantic_layer"
      budget_policy_id: ${var.budget_policy_id}

      permissions:
        - service_principal_name: ${resources.apps.dbxmetagen_app.service_principal_client_id}
          level: CAN_MANAGE_RUN

      run_as: ${var.run_as}

      email_notifications:
        on_failure:
          - ${var.alert_email}

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: model_endpoint
          default: "databricks-gpt-oss-120b"
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: genie_space_name
          default: ""
        # Granted CAN_MANAGE on the Genie space this job creates. The space is owned
        # by the job's run_as identity; with a run_as SP nobody else could see it.
        - name: genie_space_manager
          default: ${var.current_user}
        - name: materialize
          default: "false"
        - name: materialization_schedule
          default: "every 6 hours"

      tasks:
        - task_key: generate_semantic_layer
          max_retries: 1
          min_retry_interval_millis: 600000
          timeout_seconds: 86400
          environment_key: default
          notebook_task:
            notebook_path: ../../notebooks/generate_semantic_layer.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              materialize: "{{job.parameters.materialize}}"
              materialization_schedule: "{{job.parameters.materialization_schedule}}"

        - task_key: apply_metric_views
          max_retries: 1
          min_retry_interval_millis: 600000
          timeout_seconds: 14400
          depends_on:
            - task_key: generate_semantic_layer
          environment_key: default
          notebook_task:
            notebook_path: ../../notebooks/apply_metric_views.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              genie_space_name: "{{job.parameters.genie_space_name}}"
              genie_space_manager: "{{job.parameters.genie_space_manager}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
