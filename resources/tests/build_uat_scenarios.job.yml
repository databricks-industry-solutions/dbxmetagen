resources:
  jobs:
    build_uat_scenarios_job:
      name: "${var.app_name}${var.app_name_suffix}_build_uat_scenarios"
      budget_policy_id: ${var.budget_policy_id}

      permissions:
        - service_principal_name: ${resources.apps.dbxmetagen_app.service_principal_client_id}
          level: CAN_MANAGE_RUN

      email_notifications:
        on_failure:
          - ${var.current_user}

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: eval_schema
          default: uat_eval
        - name: skip_scenarios
          default: ""
        - name: base_rows
          default: "500"

      tasks:
        - task_key: build_uat_scenarios
          max_retries: 0
          timeout_seconds: 7200
          environment_key: default
          notebook_task:
            notebook_path: ../../tests/data/build_uat_scenarios.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              eval_schema: "{{job.parameters.eval_schema}}"
              skip_scenarios: "{{job.parameters.skip_scenarios}}"
              base_rows: "{{job.parameters.base_rows}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - faker
